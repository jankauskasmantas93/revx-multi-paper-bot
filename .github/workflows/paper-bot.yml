# Runs the paper trader every hour on GitHub's computers (your laptop can be off),
# saves the paper account back into this repository, and publishes the dashboard
# to GitHub Pages at https://<your-username>.github.io/<this-repo>/
name: Paper bot (hourly)

on:
  schedule:
    - cron: "5 * * * *"        # 5 minutes past every hour (GitHub may start it a few minutes late)
  workflow_dispatch:            # lets you press "Run workflow" by hand

permissions:
  contents: write               # to save the paper account
  pages: write                  # to publish the dashboard
  id-token: write

concurrency:
  group: paper-bot              # never run two at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Restore price data from the last run
        uses: actions/cache/restore@v4
        with:
          path: data
          key: revx-data-${{ github.run_id }}
          restore-keys: revx-data-

      - name: First run only - download price history (about 15 minutes)
        run: |
          if [ ! -f data/spreads.csv ]; then python download_data.py; fi

      - name: Paper trader - process the latest hour
        run: python paper_trader.py --once

      - name: Build dashboard
        run: python dashboard.py --no-open --out site

      - name: Save price data for the next run
        if: always() && hashFiles('data/spreads.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: revx-data-${{ github.run_id }}

      - name: Save paper account
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper
          git commit -m "Paper bot: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Nothing new to save"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish dashboard
        id: deploy
        uses: actions/deploy-pages@v4
